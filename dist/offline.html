<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0b1f5c">
<title>Sem internet | REVENDA DIGITAL</title>
<style>
:root{--navy:#0b1f5c;--blue:#1d44d8;--ink:#0e1a33;--muted:#4d5a73;--pale:#f3f5fa;--yellow:#f2b705}
*{box-sizing:border-box}
body{margin:0;min-height:100dvh;display:flex;flex-direction:column;background:var(--pale);color:var(--ink);font:15px/1.7 "Public Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
header{padding:20px 16px}
@media(min-width:640px){header{padding:20px 32px}}
.brand{display:inline-flex;align-items:center;gap:10px;font:800 18px/1 "Barlow",system-ui,sans-serif;letter-spacing:-.02em;color:var(--navy);text-decoration:none}
.brand b{color:var(--blue)}
main{flex:1;display:flex;align-items:center;justify-content:center;padding:0 16px 64px}
.box{max-width:480px;text-align:center}
.icon{width:64px;height:64px;margin:0 auto 24px;display:grid;place-items:center;border-radius:16px;background:#fff8e1;color:#8a6500;box-shadow:0 0 0 4px #fff,0 1px 2px #0001}
h1{margin:0;font:700 34px/1.1 "Barlow",system-ui,sans-serif;letter-spacing:-.035em}
p{margin:12px 0 0;color:var(--muted)}
button{margin-top:32px;height:44px;padding:0 20px;border:0;border-radius:8px;background:var(--blue);color:#fff;font:600 15px "Public Sans",system-ui,sans-serif;cursor:pointer;display:inline-flex;align-items:center;gap:8px}
button:hover{background:var(--navy)}
button:focus-visible{outline:3px solid var(--yellow);outline-offset:2px}
.hint{display:flex;align-items:center;justify-content:center;gap:8px;margin-top:20px;font-size:14px}
.dot{width:10px;height:10px;border-radius:50%;background:var(--yellow);animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{50%{opacity:.3}}
@media(prefers-reduced-motion:reduce){.dot{animation:none}}
</style>
</head>
<body>
<header>
  <a class="brand" href="/">
    <svg width="36" height="36" viewBox="0 0 64 64" aria-hidden="true"><path d="M13 10h38a9 9 0 0 1 9 9v26a9 9 0 0 1-9 9H13a9 9 0 0 1-9-9V19a9 9 0 0 1 9-9z" fill="#fff"/><path d="M13 10h38a9 9 0 0 1 9 9v4H4v-4a9 9 0 0 1 9-9z" fill="#1D44D8"/><circle cx="52.5" cy="16.5" r="2.5" fill="#F2B705"/><path d="M20 38.5l8 8 16-16" fill="none" stroke="#0B7A4B" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><path d="M13 10h38a9 9 0 0 1 9 9v26a9 9 0 0 1-9 9H13a9 9 0 0 1-9-9V19a9 9 0 0 1 9-9z" fill="none" stroke="#0B1F5C" stroke-width="4"/></svg>
    <span>REVENDA <b>DIGITAL</b></span>
  </a>
</header>
<main>
  <div class="box" role="alert">
    <div class="icon">
      <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20h.01"/><path d="M8.5 16.43a5 5 0 0 1 7 0"/><path d="M5 12.86a10 10 0 0 1 5.17-2.69"/><path d="M19 12.86a10 10 0 0 0-2.01-1.53"/><path d="M2 8.82a15 15 0 0 1 4.18-2.65"/><path d="M22 8.82a15 15 0 0 0-11.29-3.76"/><path d="m2 2 20 20"/></svg>
    </div>
    <h1>Você está sem internet</h1>
    <p>Não conseguimos abrir esta página porque seu dispositivo está sem conexão. Verifique o Wi-Fi, o cabo ou os dados móveis.</p>
    <button type="button" onclick="location.reload()">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/><path d="M8 16H3v5"/></svg>
      Tentar novamente
    </button>
    <p class="hint"><span class="dot" aria-hidden="true"></span> A página abre sozinha quando a conexão voltar.</p>
  </div>
</main>
<script>addEventListener("online",function(){location.reload()})</script>
</body>
</html>
